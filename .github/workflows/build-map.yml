name: Build map

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        run: |
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -o rojo.zip rojo
          chmod +x rojo

      - name: Build place file
        run: ./rojo build default.project.json -o rb_game.rbxlx

      - uses: actions/upload-artifact@v4
        with:
          name: rb_game-map
          path: rb_game.rbxlx

      - name: Commit updated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rb_game.rbxlx
          git diff --cached --quiet || (git commit -m "Rebuild rb_game.rbxlx" && git push)
